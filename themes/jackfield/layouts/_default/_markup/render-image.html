{{- $src := .Destination | safeURL -}}
{{- $path := printf "static%s" $src -}}
{{- $attrs := "" -}}
{{- if fileExists $path -}}
  {{- with (imageConfig $path) -}}
    {{- $attrs = printf ` width="%d" height="%d"` .Width .Height | safeHTMLAttr -}}
  {{- end -}}
{{- end -}}
<a href="{{ $src }}" class="imgzoom" title="Click to zoom">{{- "" -}}
<img src="{{ $src }}" alt="{{ .Text }}"{{ $attrs }} loading="lazy">{{- "" -}}
</a>
{{- "" -}}
