{{- $path := .Destination | safeURL -}}
{{- $res := resources.Get $path -}}
{{- if $res -}}
  {{- $res = $res | resources.Fingerprint "sha256" -}}
  <a href="{{ $res.RelPermalink }}" class="imgzoom" title="Click to zoom">{{- "" -}}
  <img src="{{ $res.RelPermalink }}" alt="{{ .Text }}" width="{{ $res.Width }}" height="{{ $res.Height }}" loading="lazy">{{- "" -}}
  </a>
{{- else -}}
  {{- /* fallback for non-resource images (external URLs etc.) */ -}}
  <img src="{{ $path }}" alt="{{ .Text }}" loading="lazy">
{{- end -}}
{{- "" -}}
